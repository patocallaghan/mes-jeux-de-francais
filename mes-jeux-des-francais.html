<style>
  :root{
    --le:#2F6FDE; --le-soft:#E2ECFF;
    --la:#E8457A; --la-soft:#FFE4EC;
    --sun:#F5A623; --sun-soft:#FFF0DC;
    --ok:#2EAA62; --ok-soft:#DDF5E6;
    --vio:#8A5CE0; --vio-soft:#EEE4FF;
    --ink:#2B2B3A; --mute:#7A7A8C; --paper:#FFFBF2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
  #confetti{position:fixed;inset:0;pointer-events:none;display:none;z-index:50}

  /* ---------- HUB ---------- */
  .hub-head{text-align:center;padding:22px 0 26px}
  .hub-head .flag{font-size:46px;line-height:1}
  .hub-head h1{font-size:clamp(30px,7vw,46px);font-weight:700;margin-top:6px;letter-spacing:-.5px}
  .hub-head h1 .b{color:var(--le)} .hub-head h1 .w{color:#B9B9C6} .hub-head h1 .r{color:var(--la)}
  .hub-head p{color:var(--mute);font-size:17px;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{border-radius:22px;padding:20px 18px;color:#fff;background:var(--bg);box-shadow:0 6px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;gap:6px;transition:transform .15s;min-height:200px}
  .card:hover{transform:translateY(-3px) rotate(-.5deg)}
  .card:active{transform:translateY(2px)}
  .card .ce{font-size:42px}
  .card h2{font-size:26px;font-weight:700}
  .card p{font-size:15px;opacity:.95;line-height:1.35;flex:1}
  .card .cp{background:rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-weight:600;align-self:flex-start;font-size:15px}
  .card.soon{background:transparent;border:3px dashed #D6D3C8;color:var(--mute);box-shadow:none}
  .card.soon:hover{transform:none}
  .mute{position:fixed;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12);font-size:20px;z-index:20}

  /* ---------- TOP BAR ---------- */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .back{background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap}
  .top .t{flex:1;font-size:22px;font-weight:700;text-align:center}
  .chip{background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap}

  /* ---------- LEVEL MAP ---------- */
  .legend{display:flex;gap:10px;justify-content:center;margin:2px 0 18px;flex-wrap:wrap}
  .pill{border-radius:999px;padding:6px 14px;font-weight:600;color:#fff}

<script>
/* ============ helpers ============ */
const app = document.getElementById('app');
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const take = (a, n) => shuffle(a).slice(0, Math.max(0, n));
let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const every = (fn, ms) => timers.push(setInterval(fn, ms));
function stopTimers(){ timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
let keyHandler = null;
let view = 'hub';
document.addEventListener('keydown', e => keyHandler && keyHandler(e));

/* ============ progress (account-synced, device cache fallback) ============ */
const Progress = (() => {
  const LKEY = 'fg.progress';
  let data = store.get(LKEY, null);
  if(!data){ // migrate the first version's save
    data = {games:{}, updatedAt:0};
    const old = store.get('fg.leoula', null);
    if(old) data.games['le-ou-la'] = old;
  }
  let ref = null, queue = Promise.resolve(), listeners = [];
  let status = 'device'; // 'device' | 'loading' | 'cloud'

  const clone = o => JSON.parse(JSON.stringify(o));
  const notify = () => listeners.forEach(f => f());
  function persist(){
    store.set(LKEY, data);
    if(!ref) return;
    const body = clone(data);
    queue = queue.then(() => ref.set(body)).catch(() => {});
  }

  async function connect(){
    try{
      if(!window.claude || !claude.use) return;
      status = 'loading';
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const id = db && user ? await user.id() : null;
      if(!id){ status = 'device'; notify(); return; }
      const r = db.doc('data/users/' + id + '/progress');
      const snap = await Promise.race([r.get(), new Promise((_, no) => setTimeout(() => no('timeout'), 10000))]);
      const cloud = snap.exists ? snap.data() : null;
      ref = r; status = 'cloud';
      if(cloud && (cloud.updatedAt || 0) >= (data.updatedAt || 0)){
        data = clone(cloud); if(!data.games) data.games = {};
        store.set(LKEY, data);
      } else {
        persist(); // device is newer (or account empty): push it up
      }
      notify();
    }catch(e){ ref = null; status = 'device'; notify(); }
  }

  return {
    get: (game, def) => clone(data.games[game] || def),
    set(game, val){ data.games[game] = clone(val); data.updatedAt = Date.now(); persist(); },
    resetGame(game){ delete data.games[game]; data.updatedAt = Date.now(); persist(); notify(); },
    resetAll(){ data.games = {}; data.updatedAt = Date.now(); persist(); notify(); },
    status: () => status,
    onChange: f => listeners.push(f),
    connect,
  };
})();

/* ============ confirm dialog (in-page) ============ */
function confirmBox(title, text, yesLabel, onYes){
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="mbox"><div class="big">🤔</div><h3>${title}</h3><p>${text}</p>
    <div class="btns"><button class="big-btn alt" data-a="no">Cancel</button><button class="big-btn red" data-a="yes">${yesLabel}</button></div></div>`;
  d.onclick = e => {
    const a = e.target.dataset && e.target.dataset.a;
    if(e.target === d || a === 'no') d.remove();
    if(a === 'yes'){ d.remove(); onYes(); }
  };
  document.body.appendChild(d);
}

/* ============ sound ============ */
let muted = store.get('fg.muted', false);
let actx = null;
function tone(freqs, step=0.11, type='sine', vol=0.14){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const s = t0 + i*step;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(vol, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + step + 0.08);
      o.connect(g); g.connect(actx.destination);
      o.start(s); o.stop(s + step + 0.1);
    });
  }catch(e){}
}
const sfx = {
  good: () => tone([660, 880]),
  oops: () => tone([523, 659, 784, 1047], 0.08, 'triangle'),
  bad:  () => tone([330, 247], 0.16, 'triangle', 0.18),
  win:  () => tone([523, 659, 784, 1047, 1319], 0.1, 'triangle'),
};
const muteBtn = document.getElementById('mute');
function paintMute(){ muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.onclick = () => { muted = !muted; store.set('fg.muted', muted); paintMute(); if(!muted) sfx.good(); };
paintMute();

/* ============ confetti ============ */
function confetti(){
  const c = document.getElementById('confetti'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
  const cols = ['#2F6FDE','#E8457A','#F5A623','#2EAA62','#8A5CE0'];
  const ps = Array.from({length:150}, () => ({
    x: Math.random()*c.width, y: -20 - Math.random()*c.height*0.6,
    vx: (Math.random()-.5)*3, vy: 2 + Math.random()*3,
    r: Math.random()*6.28, vr: (Math.random()-.5)*.3,
    s: 7 + Math.random()*7, c: cols[Math.random()*cols.length|0]
  }));
  let t = 0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(++t < 240) requestAnimationFrame(f); else { x.clearRect(0,0,c.width,c.height); c.style.display='none'; }
  })();
}

fin|f|!cons|end
souris|f|!cons|mouse
dent|f|!cons|tooth`},

    {name:'Tour du monde', emoji:'🌍', sub:'days · countries · more', rules:['day','month','season','lang','colour','eng','ctyf','ctym'], data:`
lundi|m|day|Monday
samedi|m|day|Saturday
mercredi|m|day|Wednesday
janvier|m|month|January
mai|m|month|May
juillet|m|month|July
printemps|m|season|spring
hiver|m|season|winter
automne|m|season|autumn|It ends in -e, but seasons are always masculine!
français|m|lang|French
anglais|m|lang|English
rouge|m|colour|red|It ends in -e, but colours are always masculine!
bleu|m|colour|blue
week-end|m|eng|weekend
sandwich|m|eng|sandwich
football|m|eng|football
parking|m|eng|car park
France|f|ctyf|France
Irlande|f|ctyf|Ireland
Espagne|f|ctyf|Spain
Italie|f|ctyf|Italy
Belgique|f|ctyf|Belgium
Chine|f|ctyf|China
Allemagne|f|ctyf|Germany
Angleterre|f|ctyf|England
Suisse|f|ctyf|Switzerland
Canada|m|ctym|Canada
Japon|m|ctym|Japan
Portugal|m|ctym|Portugal
Brésil|m|ctym|Brazil
Maroc|m|ctym|Morocco
Mexique|m|!ctyf|Mexico
Cambodge|m|!ctyf|Cambodia
Mozambique|m|!ctyf|Mozambique`},

    {name:'Chasse aux Oops', emoji:'🕵️', sub:'rule-breakers!', rules:[], special:'oops'},
    {name:'Le Grand Défi', emoji:'🏆', sub:'15 words · timed', rules:[], special:'boss'},
  ];

  LEVELS.forEach(L => {
    L.words = (L.data || '').trim().split('\n').filter(Boolean).map(line => {
      const [w, g, r, en, extra] = line.trim().split('|');
      const ex = r.startsWith('!');
      return {w, g, rule: ex ? r.slice(1) : r, ex, en, extra};
    });
  });
  const ALL = LEVELS.flatMap(L => L.words);
  const COUNTRY = new Set(['ctyf','ctym']);

  const gname = g => g === 'm' ? 'masculine' : 'feminine';
  const elides = w => /^[aeiouyhéèêâîôûœ]/i.test(w);
  function phrase(q){
    if(q.rule === 'month') return `${q.w} <span class="indef">(<span class="art m">masculine</span>)</span>`;
    const def = elides(q.w) ? "l'" : (q.g === 'm' ? 'le ' : 'la ');
    let s = `<span class="art ${q.g}">${def}</span>${q.w}`;
    if(elides(q.w) && !COUNTRY.has(q.rule))
      s += ` <span class="indef">(<span class="art ${q.g}">${q.g==='m'?'un':'une'}</span> ${q.w})</span>`;
    return s;
  }
  const exampleFor = key => (ALL.find(w => w.rule === key && !w.ex) || {}).w;

  const ID = 'le-ou-la';
  const save = () => { const d = Progress.get(ID, {stars:[]}); d.stars = LEVELS.map((_, i) => d.stars[i] || 0); return d; };
  const progress = () => { const s = save().stars; return {got: s.reduce((a,b)=>a+b,0), max: LEVELS.length*3}; };
  const starStr = n => [0,1,2].map(i => `<span class="${i<n?'on':''}">★</span>`).join('');

  /* ---------- level map ---------- */
  function renderMap(){
    keyHandler = null; view = 'map';
    const st = save().stars, p = progress();
    app.innerHTML = `
      <div class="top"><a class="back" href="#">← Games</a><div class="t">Le ou La ?</div><div class="chip">⭐ ${p.got}/${p.max}</div></div>
      <div class="legend"><span class="pill m">LE / UN = masculine</span><span class="pill f">LA / UNE = feminine</span></div>
      <div class="levels">
        ${LEVELS.map((L,i) => {
          const locked = i > 0 && !st[i-1];
          return `<button class="lvl ${locked?'locked':''} ${L.special?'boss':''}" data-i="${i}" ${locked?'aria-disabled="true"':''}>
            <div class="n">${i+1}</div><div class="e">${locked?'🔒':L.emoji}</div>
            <div class="nm">${L.name}</div><div class="sb">${L.sub}</div>
            <div class="st">${starStr(st[i])}</div></button>`;
        }).join('')}
      </div>
      <p class="hint">Score 7 out of 10 to unlock the next level.</p>
      <div class="foot"><span class="sync">${syncLabel()}</span>
        ${p.got ? '<button class="link" id="rst">↺ Reset this game</button>' : ''}</div>`;
    const rst = document.getElementById('rst');
    if(rst) rst.onclick = () => confirmBox('Reset Le ou La ?', 'All stars will be cleared and only Level 1 will be open again.', 'Reset game', () => { Progress.resetGame(ID); renderMap(); });
    app.querySelectorAll('.lvl').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if(i > 0 && !save().stars[i-1]){ b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); return; }
      renderIntro(i);
    });
  }

  /* ---------- intro ---------- */
  function renderIntro(i){
    const L = LEVELS[i]; view = 'intro';
    let body;
    if(L.special === 'oops'){
      body = `<p class="lead">Words from every level — and half of them are rule-breakers!</p>
        <div class="tip">🕵️ Look at the ending, think of the rule… then ask yourself: <b>is this one a trap?</b></div>`;
    } else if(L.special === 'boss'){
      body = `<p class="lead">15 words from all the levels. You have <b>8 seconds</b> for each one!</p>
        <div class="tip">🏆 Mix of rules and Oops words. Get 11 right to become a <b>Champion du genre</b>!</div>`;
    } else {
      body = `<p class="lead">Learn these rules:</p>
        <div class="rules">${L.rules.map(k => { const R = RULES[k]; return `
          <div class="rule ${R.g}"><b>${R.short}</b><span class="ar">→ ${R.g==='m'?'LE':'LA'}</span><small>${exampleFor(k) || ''}</small></div>`; }).join('')}
        </div>
        <div class="tip">🕵️ Watch out for <b>Oops words</b> — rule-breakers hiding in the level!</div>`;
    }
    app.innerHTML = `
      <div class="top"><button class="back" id="bk">← Levels</button><div class="t">Niveau ${i+1}</div><div style="width:80px"></div></div>
      <div class="intro"><div class="big">${L.emoji}</div><h2>${L.name}</h2>${body}
      <button class="big-btn" id="go">C'est parti ! ▶</button></div>`;
    document.getElementById('bk').onclick = renderMap;
    document.getElementById('go').onclick = () => play(i);
    keyHandler = e => { if(e.key === 'Enter'){ e.preventDefault(); play(i); } };
  }

  /* ---------- questions ---------- */
  function balanced(pool, n){
    const m = shuffle(pool.filter(w => w.g === 'm')), f = shuffle(pool.filter(w => w.g === 'f'));
    let nm = Math.floor(n/2) + (Math.random() < .5 && n % 2 ? 1 : 0);
    nm = Math.min(nm, m.length); let nf = Math.min(n - nm, f.length); nm = Math.min(n - nf, m.length);
    return m.slice(0, nm).concat(f.slice(0, nf));
  }
  function build(i){
    const L = LEVELS[i];
    let pool, total, nEx;
    if(L.special === 'oops'){ pool = ALL; total = 10; nEx = 5; }
    else if(L.special === 'boss'){ pool = ALL; total = 15; nEx = 4; }
    else { pool = L.words; total = 10; nEx = 2 + (Math.random() < .5 ? 1 : 0); }
    const exc = pool.filter(w => w.ex);
    const picked = take(exc, Math.min(nEx, exc.length));
    return shuffle(picked.concat(balanced(pool.filter(w => !w.ex), total - picked.length)));
  }

  /* ---------- play ---------- */
  function play(i){
    stopTimers(); view = 'play';
    const L = LEVELS[i];
    const S = {i, qs: build(i), n: 0, score: 0, streak: 0, best: 0, oopsSeen: 0, oopsGot: 0, missed: [], timed: L.special === 'boss'};
    S.oopsSeen = S.qs.filter(q => q.ex).length;
    ask(S);
  }

  function ask(S){
    stopTimers();
    const q = S.qs[S.n], tot = S.qs.length;
    let answered = false;
    app.innerHTML = `
      <div class="top"><button class="back" id="quit">✕</button>
        <div class="prog"><div style="width:${S.n/tot*100}%"></div></div>
        <div class="chip">🔥 ${S.streak}</div></div>
      <div class="qc">Mot ${S.n+1} / ${tot}</div>
      <div class="wcard" id="wc"><div class="w">${q.w}</div><div class="en">${q.en}</div>${S.timed?'<div class="timer" id="tm"></div>':''}</div>
      <div class="ans">
        <button class="ab m" data-g="m"><b>LE</b>un · masculine</button>
        <button class="ab f" data-g="f"><b>LA</b>une · feminine</button>
      </div>
      <div class="keys">Keyboard: ← LE &nbsp;·&nbsp; LA →</div>
      <div id="fb"></div>`;
    document.getElementById('quit').onclick = () => { stopTimers(); renderMap(); };
    app.querySelectorAll('.ab').forEach(b => b.onclick = () => answer(b.dataset.g));

    if(S.timed){
      const limit = 8000, t0 = Date.now(), tm = document.getElementById('tm');
      every(() => {
        const left = Math.max(0, 1 - (Date.now() - t0)/limit);
        tm.style.width = (left*100) + '%';
        tm.style.background = left < .3 ? '#E04B3A' : 'var(--sun)';
        if(left === 0) answer(null);
      }, 50);
    }

    function answer(g){
      if(answered) return; answered = true; stopTimers();
      const ok = g === q.g, R = RULES[q.rule];
      if(ok){ S.score++; S.streak++; S.best = Math.max(S.best, S.streak); if(q.ex) S.oopsGot++; }
      else { S.streak = 0; S.missed.push(q); }
      app.querySelectorAll('.ab').forEach(b => { b.disabled = true; if(b.dataset.g !== q.g) b.classList.add('dim'); if(b.dataset.g === g) b.classList.add('pick'); });
      const wc = document.getElementById('wc');
      wc.classList.add(ok ? (q.ex ? 'oops' : 'good') : 'bad', ok ? 'pop' : 'shake');
      app.querySelector('.top .chip').textContent = '🔥 ' + S.streak;
      app.querySelector('.prog div').style.width = ((S.n+1)/tot*100) + '%';

      const breaks = `Most <b>${R.short}</b> words are ${gname(R.g)}, but this one is <b>${gname(q.g)}</b>.`;
      let cls, title, note;
      if(ok && !q.ex){ cls='good'; title='✅ Bravo !'; note=R.note; sfx.good(); }
      else if(ok && q.ex){ cls='oops'; title='🕵️ Oops word spotted — génial !'; note=breaks; sfx.oops(); }
      else if(q.ex){ cls='oops'; title = g===null ? '⏰ Time\'s up — and it\'s an Oops word!' : '😮 Gotcha — it\'s an Oops word!'; note = breaks + ' Learn this one by heart!'; sfx.bad(); }
      else { cls='bad'; title = g===null ? '⏰ Time\'s up!' : '❌ Pas tout à fait…'; note='Remember: ' + R.note; sfx.bad(); }

      const last = S.n + 1 >= tot;
      document.getElementById('fb').innerHTML = `
        <div class="fb ${cls}"><div class="ft">${title}</div><div class="fp">${phrase(q)}</div>
        <div class="fn">${note}</div>${q.extra?`<div class="fx">💡 ${q.extra}</div>`:''}</div>
        <button class="big-btn blue next" id="nx">${last ? 'See results 🎉' : 'Next ▶'}</button>`;
      const go = () => { S.n++; last ? results(S) : ask(S); };
      document.getElementById('nx').onclick = go;
      if(ok && !q.ex && !q.extra) later(go, 1300);   // keep the pace up on easy ones
      keyHandler = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
    }

    keyHandler = e => {
      if(e.key === 'ArrowLeft'){ e.preventDefault(); answer('m'); }
      if(e.key === 'ArrowRight'){ e.preventDefault(); answer('f'); }
    };
  }

  /* ---------- results ---------- */
  function results(S){
    stopTimers(); keyHandler = null;
    const tot = S.qs.length, r = S.score / tot;
    const stars = r >= 1 ? 3 : r >= .8 ? 2 : r >= .7 ? 1 : 0;
    const d = save(); const prev = d.stars[S.i];
    if(stars > prev){ d.stars[S.i] = stars; Progress.set(ID, d); }
    const unlocked = stars > 0 && !prev && S.i < LEVELS.length - 1;
    const boss = LEVELS[S.i].special === 'boss';
    const head = stars === 3 ? (boss ? 'Champion du genre ! 👑' : 'Parfait !') : stars === 2 ? 'Très bien !' : stars === 1 ? 'Bien joué !' : 'Presque !';
    const msg = stars === 0 ? `You need ${Math.ceil(tot*.7)} to pass — have another go!`
              : unlocked ? `Level ${S.i+2} is now unlocked! 🔓`
              : boss ? 'You beat the Grand Défi!' : `Best streak: 🔥 ${S.best}`;
    app.innerHTML = `
      <div class="res">
        <div class="big">${stars === 0 ? '💪' : boss ? '🏆' : '🎉'}</div>
        <h2>${head}</h2>
        <div class="score">${S.score} / ${tot} correct</div>
        <div class="stars">${starStr(stars)}</div>
        <p class="msg">${msg}</p>
        ${S.oopsSeen ? `<div class="oc">🕵️ Oops words spotted: ${S.oopsGot} / ${S.oopsSeen}</div>` : ''}
        ${S.missed.length ? `<div class="review"><h3>📝 Words to practise</h3><ul>${S.missed.map(q =>
            `<li>${phrase(q)}<small>${q.en}${q.ex ? ' · 🕵️ Oops word' : ''}</small></li>`).join('')}</ul></div>` : ''}
        <div class="btns">
          <button class="big-btn alt" id="again">↻ Rejouer</button>
          ${stars > 0 && S.i < LEVELS.length - 1 ? `<button class="big-btn" id="nextL">Niveau ${S.i+2} ▶</button>` : ''}
          <button class="big-btn blue" id="map">Levels</button>
        </div>
      </div>`;
    document.getElementById('again').onclick = () => play(S.i);
    document.getElementById('map').onclick = renderMap;
    const nl = document.getElementById('nextL'); if(nl) nl.onclick = () => renderIntro(S.i + 1);
    if(stars > 0){ sfx.win(); confetti(); }
  }

  return {start: renderMap, progress, _test: {LEVELS, ALL, RULES, build}};
})();

/* =====================================================================
   HUB — add new games to this list
   ===================================================================== */
const GAMES = [
  {id:'le-ou-la', title:'Le ou La ?', emoji:'🎯', bg:'linear-gradient(135deg,#2F6FDE 0%,#8A5CE0 55%,#E8457A 100%)',
   blurb:'Masculine or feminine? Learn the word endings and catch the sneaky rule-breakers.', game: LeOuLa},
];

function syncLabel(){
  const s = Progress.status();
  return s === 'cloud' ? '☁️ Progress saved to your account' : s === 'loading' ? '⏳ Loading progress…' : '📱 Progress saved on this device';
}

function renderHub(){
  keyHandler = null; view = 'hub';
  const any = GAMES.some(g => g.game.progress().got > 0);
  app.innerHTML = `
    <header class="hub-head"><div class="flag">🇫🇷</div>
      <h1>Mes Jeux de <span class="b">Fran</span><span class="w">ç</span><span class="r">ais</span></h1>
      <p>Choisis un jeu ! · Pick a game to play</p></header>
    <div class="grid">
      ${GAMES.map(g => { const p = g.game.progress(); return `
        <a class="card" href="#${g.id}" style="--bg:${g.bg}">
          <div class="ce">${g.emoji}</div><h2>${g.title}</h2><p>${g.blurb}</p>
          <div class="cp">⭐ ${p.got} / ${p.max}</div></a>`; }).join('')}
      <div class="card soon"><div class="ce">✨</div><h2>Bientôt…</h2><p>More French games coming soon!</p></div>
    </div>
    <div class="foot"><span class="sync">${syncLabel()}</span>
      ${any ? '<button class="link" id="rstall">↺ Reset all progress</button>' : ''}</div>`;
  const r = document.getElementById('rstall');
  if(r) r.onclick = () => confirmBox('Reset everything?', 'This clears the stars and levels in every game. It can’t be undone.', 'Reset all', () => { Progress.resetAll(); renderHub(); });
}

function route(){
  stopTimers();
  const g = GAMES.find(x => x.id === location.hash.slice(1));
  g ? g.game.start() : renderHub();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
// when account progress arrives (or is reset), refresh the menus — never interrupt a game in progress
Progress.onChange(() => { if(view === 'hub') renderHub(); else if(view === 'map') LeOuLa.start(); });
route();
Progress.connect();
</script>
